[build.environment]
GO_VERSION = "1.24.2"
HUGO_VERSION = "0.166.0"
NODE_VERSION = "22"

[build]
publish = "public"
command = "git config core.quotepath false && hugo --gc --minify"

[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
