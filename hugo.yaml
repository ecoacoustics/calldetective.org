baseURL: "https://calldetective.org/"
languageCode: "en-us"
title: "Call Detective"
theme: "microsite-template"
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: "*"
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp
        Cross-Origin-Resource-Policy: cross-origin
        # CSP for local development - must be kept in sync with netlify.toml
        Content-Security-Policy-Report-Only: "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://cdn.jsdelivr.net https://maps.googleapis.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com https://maps.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com https://*.googleusercontent.com; connect-src 'self' data: https://*.ecosounds.org https://*.acousticobservatory.org https://cdn.jsdelivr.net https://maps.googleapis.com https://maps.gstatic.com https://www.google-analytics.com; media-src 'self' https://*.ecosounds.org https://*.acousticobservatory.org; frame-src 'none'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
        ignoreLogs:
          - warning-goldmark-raw-html
module:
  hugoVersion:
    extended: true
    min: 0.125.0
markup:
  goldmark:
    renderer:
      unsafe: true
security:
  allowContent:
    - "! ^text/org$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      # Read by the theme's map shortcode. Set these locally and in Netlify.
      - "^GOOGLE_MAPS_API_KEY$"
      - "^GOOGLE_MAPS_MAP_ID$"
params:
  # Headline stats shown in the hero (layouts/partials/hero.html). Projects
  # isn't listed here — it's counted from params.showcase automatically.
  stats:
    events: 45071
    verifications: 21980
  map:
    # Theme default 4 is too tight to fit full Australia on mobile.
    min_zoom: 3
    sites:
