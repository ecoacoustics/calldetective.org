baseURL: "https://calldetective.org/"
languageCode: "en-us"
title: "Call Detective"
theme: "microsite-template"
server:
  headers:
    - for: /**
      values:
        Access-Control-Allow-Origin: "*"
        Cross-Origin-Opener-Policy: same-origin
        Cross-Origin-Embedder-Policy: require-corp
        Cross-Origin-Resource-Policy: cross-origin
        ignoreLogs:
          - warning-goldmark-raw-html
module:
  hugoVersion:
    extended: true
    min: 0.125.0
markup:
  goldmark:
    renderer:
      unsafe: true
security:
  allowContent:
    - "! ^text/org$"
  funcs:
    getenv:
      - "^HUGO_"
      - "^CI$"
      # Read by the theme's map shortcode. Set these locally and in Netlify.
      - "^GOOGLE_MAPS_API_KEY$"
      - "^GOOGLE_MAPS_MAP_ID$"
params:
  # Headline stats shown in the hero (layouts/partials/hero.html). Projects
  # isn't listed here — it's counted from params.showcase automatically.
  stats:
    events: 45071
    verifications: 21980
  map:
    # Theme default 4 is too tight to fit full Australia on mobile.
    min_zoom: 3
    sites:
      - campaign: "Daintree Rainforest Observatory"
        latitude: -16.103236
        longitude: 145.452491
        location: "Cape Tribulation, Queensland"
        image: "/daintree.jpg"
        audio: "https://api.acousticobservatory.org/audio_recordings/492563/media.mp3?end_offset=5880&start_offset=5850"
      - campaign: "Mount Barney"
        latitude: -28.234639
        longitude: 152.641407
        location: "Scenic Rim, Queensland"
        image: "/mtbarney.jpg"
        audio: "https://api.acousticobservatory.org/audio_recordings/1421163/media.mp3?end_offset=4650&start_offset=4620"
      - campaign: "Bowra Station"
        latitude: -27.981830
        longitude: 145.611615
        location: "Cunnamulla, Queensland"
        image: "/bowra.jpg"
        audio: "https://api.acousticobservatory.org/audio_recordings/1540597/media.mp3?end_offset=150&start_offset=120"
  colors:
    primary: "#de9843"
    on_primary: "#000000"
    primary_container: "#f7f4e5"
    on_primary_container: "#163525"

    secondary: "#de9843"
    on_secondary: "#000000"
    secondary_container: "#de9843"
    on_secondary_container: "#000000"

    surface: "#d3d4b5"
    on_surface: "#163525"

    surface_container_lowest: "#fffef6"
    surface_container_high: "#f7f4e5"
    surface_container: "#f8f2eb"
    surface_container_low: "#e3ded9"

    surface_variant: "#f7f4e5"
    on_surface_variant: "#444746"

    outline: "#c7883c"
    overlay: "rgb(23 29 26 / 74%)"
    error: "#b00020"
  showcase:
    - title: "Can you hear an Australasian Bittern"
      description: "The Eavesdropping on Wetland Birds project has been using Call Detective to validate australian bittern calls across a network of remote recording devices."
      image: "/bittern.jpg"
      link: "https://bittern.calldetective.org/"
      eventCountFilter: ""
      verifiedCountFilter: ""
    - title: "Where are the Gang-gangs?"
      description: "Help Museums Victoria find and identify gang-gang cockatoos in their recordings."
      image: "/gang_gang.jpg"
      link: "https://gang-gangs.calldetective.org"
      eventCountFilter: ""
      verifiedCountFilter: ""
    - title: "Tassie Calling"
      description: "Protect Tasmania is working to build a stronger future for threatened species conservation by advancing the use of bioacoustic detection and monitoring across Tasmania."
      image: "/tassie_calling.jpg"
      link: "https://tassie-calling.calldetective.org/"
      eventCountFilter: ""
      verifiedCountFilter: ""
    - title: "Whoo's Calling"
      image: "/whoos_calling.jpg"
      description: "Birdlife Australia is using a Call Detective project to validate powerful owl calls created by AI workflows."
      link: "https://powerful-owl.calldetective.org/"
      eventCountFilter: ""
      verifiedCountFilter: ""
  sponsors:
    logos:
      - image: "images/google-logo.webp"
        alt: "Google logo"
        url: "https://www.google.com"
      - image: "images/deepmind-logo.webp"
        alt: "Google Deepmind logo"
        url: "https://deepmind.google"
